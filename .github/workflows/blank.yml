name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o grok-workspace-updated.zip -d extracted
          echo "Project structure:"
          find extracted -maxdepth 4 -type f \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "package.json" \)

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          
cd extracted/android
gradle assembleDebug


      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
