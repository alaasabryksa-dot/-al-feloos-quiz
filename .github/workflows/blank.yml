
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o grok-workspace-updated.zip -d project
          echo "Project files:"
          ls -la project
          find project -name gradlew -o -name package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd project
          GRADLEW=$(find . -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
